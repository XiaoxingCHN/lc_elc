name: Repository checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-maintenance:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python tools/repo_check.py
      - run: python -m pip install -r tools/requirements-client-release.txt
      - run: python -m unittest discover -s maintenance/checks -v
      - run: python tools/generate_routes.py --check
      - run: git diff --check
