android.builtInKotlin=false
# This workspace lives under a non-ASCII path ("实验室库存系统_v2.1.1_部署包"), and
# AGP 9.1 refuses to configure such a project by default:
#   "Failed to apply plugin 'com.android.internal.application'.
#    Your project path contains non-ASCII characters."
# That single refusal is what produced the misleading cascade of
# "Unresolved reference 'android' / 'flutter'" errors while compiling
# android/app/build.gradle.kts. AGP's own message documents this opt-out, and
# the release APK is built from exactly this directory, so the check is disabled
# here deliberately. If the project is ever moved to an ASCII path, this line can
# be deleted.
android.overridePathCheck=true
