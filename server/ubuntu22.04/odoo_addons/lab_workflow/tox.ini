[tox]
envlist = py310, py312
skipsdist = True

# 这是给 CI / 本地跑 lab_workflow 离线逻辑测试用的最小配置。
# Odoo 集成测试请用 `odoo-bin test -d <隔离库> --test-tags lab_workflow`。

[testenv]
deps =
    reportlab>=3.6.8
    qrcode>=7.3.1
    pypdf>=4
setenv =
    PYTHONPATH = {toxinidir}
commands =
    python -m unittest discover -s tests -p "test_offline_logic.py" -v

[testenv:pdf]
# 真实生成 PDF 并检查中文/二维码（需要 reportlab + pypdf）
deps =
    reportlab>=3.6.8
    pypdf>=4
commands =
    python tools/pdf_selfcheck.py
