# 公共代理头：X-Forwarded-For 必须覆盖为已校验来源地址，绝不追加客户端自带值
# 公开 authority：server 段已用 $http_host 严格值校验（仅 team.l-creation.club、
# :443、:9500 三个确切值，见 bore-public-allowlist.conf.template），因此这里
# 传递的是**已校验的完整 authority（含非标准端口）**，而不是客户端任意 Host。
# 用 $host 会把非标准端口去掉，上游 ProxyFix 按 X-Forwarded-Host 重建 origin 时
# 就丢端口，/logout 等 303 会落到没有端口的 origin（浏览器 CSP form-action 违规）。
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto https;
# 客户端自带的转发链/端口提示一律丢弃：Forwarded 清空，X-Forwarded-Port 显式清空
# （nginx 中空值表示不向上游发送该头），避免上游据此重建出另一个 origin。
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-Port "";
proxy_set_header X-Team-Gateway lab-team-web;
